<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escapando da Escola - Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1e1e2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #f5c2e7;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #game-container {
      position: relative;
      border: 4px solid #cba6f7;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #89dceb;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      color: #bac2de;
      text-align: center;
    }
    .key {
      background: #313244;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #45475a;
      color: #cdd6f4;
    }
  </style>
</head>
<body>

  <h1>🏫 Escapando da Escola!</h1>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="instructions">
    Use <span class="key">A</span> <span class="key">D</span> ou <span class="key">←</span> <span class="key">→</span> para andar | 
    <span class="key">W</span> / <span class="key">Espaço</span> / <span class="key">↑</span> para pular<br>
    Colete os 📚 **Cadernos** e pule na cabeça das 📐 **Esquadros/Régua** ou dos ⏰ **Relógios de Ponto**!
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Configurações Globais
    const GRAVITY = 0.55;
    let cameraX = 0;
    let score = 0;
    let gameOver = false;
    let gameWon = false;

    // Teclas Pressionadas
    const keys = {
      left: false,
      right: false,
      up: false
    };

    // Eventos de Teclado
    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = true;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = true;
      if (["ArrowUp", "w", "W", " "].includes(e.key)) {
        if (!keys.up && player.grounded && !gameOver && !gameWon) {
          player.vy = -player.jumpStrength;
          player.grounded = false;
        }
        keys.up = true;
      }
      if (e.key === "r" || e.key === "R") {
        if (gameOver || gameWon) restartGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = false;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = false;
      if (["ArrowUp", "w", "W", " "].includes(e.key)) keys.up = false;
    });

    // Jogador (Aluno)
    const player = {
      x: 50,
      y: 200,
      width: 30,
      height: 45,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpStrength: 11.5,
      grounded: false,
      facing: "right",
      reset() {
        this.x = 50;
        this.y = 200;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
      }
    };

    // Plataformas do Cenário (Escola)
    const platforms = [
      // Chão Principal
      { x: 0, y: 350, width: 800, height: 50, type: "ground" },
      { x: 900, y: 350, width: 900, height: 50, type: "ground" },
      { x: 1900, y: 350, width: 1000, height: 50, type: "ground" },

      // Carteiras e Mesas
      { x: 250, y: 260, width: 100, height: 15, type: "desk" },
      { x: 420, y: 200, width: 120, height: 15, type: "desk" },
      { x: 600, y: 270, width: 80, height: 15, type: "desk" },

      // Prateleiras / Armários
      { x: 1000, y: 250, width: 140, height: 15, type: "shelf" },
      { x: 1220, y: 180, width: 100, height: 15, type: "shelf" },
      { x: 1400, y: 260, width: 150, height: 15, type: "shelf" },

      // Obstáculos finais até a saída
      { x: 2050, y: 270, width: 110, height: 15, type: "desk" },
      { x: 2250, y: 200, width: 110, height: 15, type: "desk" },
      { x: 2450, y: 270, width: 120, height: 15, type: "desk" }
    ];

    // Inimigos (Material Escolar / Monitores)
    let enemies = [];
    function initEnemies() {
      enemies = [
        { x: 450, y: 175, width: 25, height: 25, vx: -1.5, minX: 420, maxX: 520, type: "esquadro" },
        { x: 1050, y: 225, width: 25, height: 25, vx: 2, minX: 1000, maxX: 1120, type: "relogio" },
        { x: 1200, y: 325, width: 25, height: 25, vx: -1.8, minX: 1000, maxX: 1400, type: "esquadro" },
        { x: 2100, y: 325, width: 25, height: 25, vx: 2.2, minX: 1950, maxX: 2300, type: "relogio" }
      ];
    }

    // Colecionáveis (Cadernos)
    let collectibles = [];
    function initCollectibles() {
      collectibles = [
        { x: 280, y: 220, width: 18, height: 22, collected: false },
        { x: 470, y: 160, width: 18, height: 22, collected: false },
        { x: 630, y: 230, width: 18, height: 22, collected: false },
        { x: 1050, y: 210, width: 18, height: 22, collected: false },
        { x: 1260, y: 140, width: 18, height: 22, collected: false },
        { x: 2100, y: 230, width: 18, height: 22, collected: false },
        { x: 2500, y: 230, width: 18, height: 22, collected: false }
      ];
    }

    // Portão de Saída (Fim de Jogo)
    const exitGate = { x: 2750, y: 230, width: 60, height: 120 };

    function restartGame() {
      score = 0;
      gameOver = false;
      gameWon = false;
      player.reset();
      initEnemies();
      initCollectibles();
    }

    // Colisão AABB
    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // Loop de Atualização
    function update() {
      if (gameOver || gameWon) return;

      // Movimentação do Jogador
      if (keys.left) {
        player.vx = -player.speed;
        player.facing = "left";
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = "right";
      } else {
        player.vx = 0;
      }

      // Gravidade
      player.vy += GRAVITY;

      // Atualiza Posição X
      player.x += player.vx;

      // Colisão Horizontal com Plataformas
      platforms.forEach((p) => {
        if (checkCollision(player, p)) {
          if (player.vx > 0) player.x = p.x - player.width;
          else if (player.vx < 0) player.x = p.x + p.width;
        }
      });

      // Atualiza Posição Y
      player.y += player.vy;
      player.grounded = false;

      // Colisão Vertical com Plataformas
      platforms.forEach((p) => {
        if (checkCollision(player, p)) {
          if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 10) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = p.y + p.height;
            player.vy = 0;
          }
        }
      });

      // Queda fora do mapa
      if (player.y > canvas.height + 100) {
        gameOver = true;
      }

      // Câmera segue o jogador
      cameraX = player.x - canvas.width / 3;
      if (cameraX < 0) cameraX = 0;

      // Atualizar Inimigos
      enemies.forEach((e) => {
        e.x += e.vx;
        if (e.x < e.minX || e.x + e.width > e.maxX) {
          e.vx *= -1;
        }

        // Colisão com o Jogador
        if (checkCollision(player, e)) {
          // Pulo na cabeça do inimigo
          if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 10) {
            e.x = -9999; // Remove o inimigo
            player.vy = -8; // Quique
            score += 100;
          } else {
            gameOver = true;
          }
        }
      });

      // Colecionáveis
      collectibles.forEach((c) => {
        if (!c.collected && checkCollision(player, c)) {
          c.collected = true;
          score += 50;
        }
      });

      // Checar Vitória (Portão de Saída)
      if (checkCollision(player, exitGate)) {
        gameWon = true;
      }
    }

    // Renderização
    function draw() {
      // Fundo (Parede de Sala de Aula)
      ctx.fillStyle = "#89dceb";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Desenhar Detalhes do Fundo (Lousa / Quadros)
      ctx.fillStyle = "#2d5a27"; // Lousa escolar
      ctx.fillRect(150, 80, 200, 100);
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 4;
      ctx.strokeRect(150, 80, 200, 100);

      // Texto na Lousa
      ctx.fillStyle = "#ffffff";
      ctx.font = "12px sans-serif";
      ctx.fillText("2 + 2 = 4", 170, 110);
      ctx.fillText("Prova Hoje!", 170, 140);

      // Desenhar Plataformas
      platforms.forEach((p) => {
        if (p.type === "ground") {
          ctx.fillStyle = "#a6e3a1"; // Grama/Piso externo
          ctx.fillRect(p.x, p.y, p.width, p.height);
          ctx.fillStyle = "#6c7086";
          ctx.fillRect(p.x, p.y + 10, p.width, p.height - 10);
        } else {
          // Carteiras / Prateleiras
          ctx.fillStyle = "#fab387"; // Madeira
          ctx.fillRect(p.x, p.y, p.width, p.height);
          ctx.fillStyle = "#b4befe"; // Pés de metal
          ctx.fillRect(p.x + 5, p.y + p.height, 4, 15);
          ctx.fillRect(p.x + p.width - 9, p.y + p.height, 4, 15);
        }
      });

      // Desenhar Portão de Saída
      ctx.fillStyle = "#f38ba8";
      ctx.fillRect(exitGate.x, exitGate.y, exitGate.width, exitGate.height);
      ctx.fillStyle = "#11111b";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("SAÍDA", exitGate.x + 8, exitGate.y + 60);

      // Desenhar Cadernos (Colecionáveis)
      collectibles.forEach((c) => {
        if (!c.collected) {
          ctx.fillStyle = "#f9e2af";
          ctx.fillRect(c.x, c.y, c.width, c.height);
          ctx.fillStyle = "#89b4fa"; // Capa do caderno
          ctx.fillRect(c.x + 3, c.y, c.width - 3, c.height);
        }
      });

      // Desenhar Inimigos
      enemies.forEach((e) => {
        if (e.type === "esquadro") {
          ctx.fillStyle = "#f38ba8";
          ctx.beginPath();
          ctx.moveTo(e.x, e.y + e.height);
          ctx.lineTo(e.x + e.width / 2, e.y);
          ctx.lineTo(e.x + e.width, e.y + e.height);
          ctx.closePath();
          ctx.fill();
        } else {
          // Relógio
          ctx.fillStyle = "#f5e0dc";
          ctx.beginPath();
          ctx.arc(e.x + e.width / 2, e.y + e.height / 2, e.width / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#11111b";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      // Desenhar Jogador (Aluno com Mochila)
      // Corpo / Uniforme
      ctx.fillStyle = "#89b4fa"; // Camisa azul
      ctx.fillRect(player.x, player.y + 12, player.width, 20);

      ctx.fillStyle = "#1e1e2e"; // Calça escura
      ctx.fillRect(player.x + 3, player.y + 32, 10, 13);
      ctx.fillRect(player.x + 17, player.y + 32, 10, 13);

      // Cabeça
      ctx.fillStyle = "#f5e0dc"; // Pele
      ctx.fillRect(player.x + 5, player.y, 20, 14);

      // Cabelo
      ctx.fillStyle = "#45475a";
      ctx.fillRect(player.x + 3, player.y - 2, 24, 6);

      // Mochila nas costas
      ctx.fillStyle = "#a6e3a1";
      if (player.facing === "right") {
        ctx.fillRect(player.x - 5, player.y + 14, 7, 16);
      } else {
        ctx.fillRect(player.x + player.width - 2, player.y + 14, 7, 16);
      }

      ctx.restore();

      // UI (Pontuação e HUD)
      ctx.fillStyle = "#11111b";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Pontos: ${score}`, 20, 30);

      // Tela de Game Over
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f38ba8";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("VOCÊ FOI PEGO!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#cdd6f4";
        ctx.font = "18px sans-serif";
        ctx.fillText("Pressione 'R' para tentar novamente", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
      }

      // Tela de Vitória
      if (gameWon) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#a6e3a1";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("VOCÊ ESCAPOU DA ESCOLA!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#cdd6f4";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Pontuação Final: ${score} | Pressione 'R' para jogar de novo`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
      }
    }

    // Loop Principal
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Inicialização
    restartGame();
    gameLoop();
  </script>
</body>
</html>
